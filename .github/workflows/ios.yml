name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract project
        run: unzip -o ketishiguang_v10_cloud_build.zip
      - name: Generate iOS platform
        working-directory: ketishiguang_mvp
        run: flutter create --platforms=ios --org com.ketishiguang .
      - name: Apply compatibility fixes
        working-directory: ketishiguang_mvp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path("pubspec.yaml")
          lines = pubspec.read_text().splitlines()
          found = False
          for index, line in enumerate(lines):
              if line.strip().startswith("file_picker:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + "file_picker: ^10.3.10"
                  found = True
                  break
          if not found:
              raise SystemExit("Could not find file_picker dependency in pubspec.yaml")
          pubspec.write_text("\n".join(lines) + "\n")

          main = Path("lib/main.dart")
          source = main.read_text()
          source = source.replace(
              "import 'package:excel/excel.dart';",
              "import 'package:excel/excel.dart' hide Border;",
          )
          pattern = r"  Future<void> _createSemester\(\) async \{.*?\n  \}\n\n  bool _occurs"
          replacement = """  Future<void> _createSemester() async {
              var name = '';
              final result = await showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('新建学期'),
                  content: TextField(
                    autofocus: true,
                    key: const Key('semester-create-name'),
                    onChanged: (value) => name = value,
                    decoration: const InputDecoration(
                      labelText: '学期名称',
                      hintText: '例如 2027-2028学年第1学期',
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text('取消'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(ctx, name.trim()),
                      child: const Text('创建', key: Key('semester-create-confirm')),
                    ),
                  ],
                ),
              );
              if (result == null || result.isEmpty || !mounted) return;
              name = result;
              _archive.updateActiveData(
                courses: _courseRows(),
                unscheduledCourses: _unscheduledRows(),
                updatedAt: DateTime.now().toIso8601String(),
                preserveUndo: true,
              );
              final id = SemesterArchive.idForName(name);
              if (!_archive.createSemester(id: id, name: name)) {
                _message('这个学期已经存在，可以从学期列表切换过去。');
                return;
              }
              _applyActiveSemester();
              await _persistArchive(removeLegacyKeys: true);
              _message('已创建并切换到$name。');
            }

            bool _occurs"""
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not safely locate _createSemester for patching")
          main.write_text(updated)
          Path("test/widget_test.dart").unlink(missing_ok=True)
          PY
          flutter pub get
      - name: Apply project source overlays
        working-directory: ketishiguang_mvp
        run: |
          cp -a ../app_patch/. .
          python3 scripts/apply_pdf_importer_patch.py
      - name: Format Dart sources
        working-directory: ketishiguang_mvp
        run: dart format lib test
      - name: Static analysis
        working-directory: ketishiguang_mvp
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: ketishiguang_mvp
        run: flutter test
      - name: Build iOS release (unsigned)
        working-directory: ketishiguang_mvp
        run: flutter build ios --release --no-codesign
