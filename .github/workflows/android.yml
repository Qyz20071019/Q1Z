name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract project
        run: unzip -o ketishiguang_v10_cloud_build.zip
      - name: Generate Android platform
        working-directory: ketishiguang_mvp
        run: flutter create --platforms=android --org com.ketishiguang .
      - name: Configure Android SDK
        working-directory: ketishiguang_mvp
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi
      - name: Resolve dependencies
        working-directory: ketishiguang_mvp
        run: flutter pub get
      - name: Raise Android plugin compile SDK
        working-directory: ketishiguang_mvp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          packages = cache / "hosted" / "pub.dev"
          found = False
          changed = []
          for path in packages.glob("*/android/build.gradle*"):
              if path.parent.parent.name.startswith("file_picker-"):
                  found = True
              source = path.read_text()
              updated = re.sub(r"compileSdkVersion\\s+(?:flutter\\.compileSdkVersion|\\d+)", "compileSdkVersion 36", source)
              updated = re.sub(r"compileSdk\\s*=\\s*(?:flutter\\.compileSdkVersion|\\d+)", "compileSdk = 36", updated)
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))
          print("Patched Android plugin Gradle files:")
          print("\\n".join(changed) if changed else "(none)")
          if not found:
              raise SystemExit("file_picker Android Gradle project was not found in pub cache")
          if not any("file_picker-" in item for item in changed):
              raise SystemExit("file_picker compileSdk was not updated; refusing to continue")
          PY
      - name: Apply compatibility fixes
        working-directory: ketishiguang_mvp
        run: |
          sed -i "s#import 'package:excel/excel.dart';#import 'package:excel/excel.dart' hide Border;#" lib/main.dart
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("lib/main.dart")
          source = path.read_text()
          pattern = r"  Future<void> _createSemester\(\) async \{.*?\n  \}\n\n  bool _occurs"
          replacement = """  Future<void> _createSemester() async {
              var name = '';
              final result = await showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('新建学期'),
                  content: TextField(
                    autofocus: true,
                    key: const Key('semester-create-name'),
                    onChanged: (value) => name = value,
                    decoration: const InputDecoration(
                      labelText: '学期名称',
                      hintText: '例如 2027-2028学年第1学期',
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text('取消'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(ctx, name.trim()),
                      child: const Text('创建', key: Key('semester-create-confirm')),
                    ),
                  ],
                ),
              );
              if (result == null || result.isEmpty || !mounted) return;
              name = result;
              _archive.updateActiveData(
                courses: _courseRows(),
                unscheduledCourses: _unscheduledRows(),
                updatedAt: DateTime.now().toIso8601String(),
                preserveUndo: true,
              );
              final id = SemesterArchive.idForName(name);
              if (!_archive.createSemester(id: id, name: name)) {
                _message('这个学期已经存在，可以从学期列表切换过去。');
                return;
              }
              _applyActiveSemester();
              await _persistArchive(removeLegacyKeys: true);
              _message('已创建并切换到$name。');
            }

            bool _occurs"""
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not safely locate _createSemester for patching")
          path.write_text(updated)
          PY
      - name: Format Dart sources
        working-directory: ketishiguang_mvp
        run: dart format lib test
      - name: Static analysis
        working-directory: ketishiguang_mvp
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: ketishiguang_mvp
        run: flutter test
      - name: Build release APK
        working-directory: ketishiguang_mvp
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketishiguang-android-apk
          path: ketishiguang_mvp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
